<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jam Adzan - Indonesia</title>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
    transition: background 0.5s;
  }

  body.blackout { background: #000; }
  body.blackout .container { visibility: hidden; }
  body.blackout::after {
    content: '';
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
  }

  .container { padding: 20px; width: 100%; max-width: 780px; }

  h1 {
    font-size: 1.3rem;
    opacity: 0.8;
    letter-spacing: 2px;
    margin: 0 0 10px;
  }

  .location {
    font-size: 0.9rem;
    color: #00ffcc;
    opacity: 0.9;
    margin-bottom: 5px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }

  #citySelect {
    background: rgba(0, 255, 204, 0.15);
    color: #00ffcc;
    border: 1px solid rgba(0, 255, 204, 0.4);

    font-family: 'Segoe UI', sans-serif;
    cursor: pointer;
    outline: none;
  }
  #citySelect option { background: #203a43; color: #fff; }

  .clock {
    font-size: 3.5rem;
    font-weight: bold;
    margin: 10px 0;
    text-shadow: 0 0 20px #00ffcc;
    font-variant-numeric: tabular-nums;
  }

  .date {
    font-size: 0.95rem;
    opacity: 0.7;
    margin-bottom: 20px;
  }

  .next {
    background: rgba(255,255,255,0.1);
    padding: 15px 25px;
    border-radius: 15px;
    display: inline-block;
    backdrop-filter: blur(10px);
    margin-bottom: 25px;
    min-width: 280px;
  }
  .next-label { font-size: 0.85rem; opacity: 0.7; }
  .next-name {
    font-size: 1.6rem;
    color: #00ffcc;
    font-weight: bold;
    margin: 4px 0;
    min-height: 1.6rem;
  }
  .countdown {
    font-size: 1.1rem;
    font-variant-numeric: tabular-nums;
  }

  .next.qobla .next-label { color: #ffd54f; }
  .next.qobla .next-name { color: #ffd54f; font-size: 1.3rem; }
  .next.qobla .countdown { color: #ffd54f; }

  /* ===== Tabel Umum ===== */
  .jadwal-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: rgba(255,255,255,0.06);
    border-radius: 15px;
    overflow: hidden;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    table-layout: fixed;
    margin-bottom: 20px;
  }

  .jadwal-table th,
  .jadwal-table td {
    padding: 12px 3px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    border-left: 1px solid rgba(255,255,255,0.08);
  }
  .jadwal-table th:first-child,
  .jadwal-table td:first-child { border-left: none; }

  .jadwal-table thead th {
    background: rgba(0, 255, 204, 0.15);
    color: #00ffcc;
    font-size: 0.7rem;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    font-weight: 600;
    padding: 10px 2px;
  }

  .jadwal-table tbody td {
    font-size: 1rem;
    font-weight: 600;
    border-top: 1px solid rgba(255,255,255,0.08);

  }

  .jadwal-table tbody tr.iqomah-row td {
    font-size: 0.7rem;
    font-weight: normal;
    color: #ffd54f;
    padding: 6px 2px;
    background: rgba(255, 213, 79, 0.06);
    white-space: nowrap;
  }
  .jadwal-table tbody tr.iqomah-row input {
    width: 42px;
    background: rgba(255,255,255,0.1);
    color: #ffd54f;

    border-color: #ffd54f;

  }

  .jadwal-table .active {
    background: linear-gradient(180deg, rgba(0,255,204,0.25), rgba(0,255,204,0.05));

  /* ===== Tabel ON/OFF AC ===== */
    .ac-table-title {

  .ac-table {

  .ac-table tbody tr.row-on th { color: #69f0ae; }

  .ac-table input {
    width: 100%;

    background: rgba(255,255,255,0.1);

    border: 1px solid rgba(255,255,255,0.25);

  .ac-table tr.row-on input { color: #69f0ae; border-color: rgba(105,240,174,0.4); }

    .jadwal-table tbody td { font-size: 0.82rem; padding: 10px 1px; }

    .ac-table tbody th { font-size: 0.65rem; padding-left: 6px; }
    .ac-table input { max-width: 36px; padding: 4px 2px; font-size: 0.7rem; }

  /* Kolom ON/OFF dipersempit, kolom hari dilebarkan */

  }

  /* Input lebih kompak */
  .ac-table input {
    max-width: 100%;
    width: 100%;
    padding: 4px 2px;
    font-size: 0.8rem;
  }

  /* Mobile: makin kompak lagi */

    .ac-table thead th:first-child,

    }
  }

 
</style>

<body>
<div class="container">

<script>
// ====== Konfigurasi ======
const COUNTRY = 'Indonesia';
const METHOD = 20;
let currentCity = 'Klaten';

// ====== State ======
let jadwal = {};
let lastFetchDate = '';
let triggeredAdzan = {};
let triggeredIqomahWarn = {};
let triggeredIqomahStart = {};
let blackoutTimer = null;

const namaHari  = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const namaBulan = ["Januari","Februari","Maret","April","Mei","Juni",
                   "Juli","Agustus","September","Oktober","November","Desember"];
const namaIndo = {
  Fajr: 'Subuh',
  Sunrise: 'Terbit',
  Dhuhr: 'Dzuhur',
  Asr: 'Ashar',
  Maghrib: 'Maghrib',
  Isha: 'Isya'
};
const urutanSholat = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];

const iqomahInput = {
  Fajr: 'iqomahFajr',
  Dhuhr: 'iqomahDhuhr',
  Asr: 'iqomahAsr',
  Maghrib: 'iqomahMaghrib',
  Isha: 'iqomahIsha'
};

function pad(n){ return n.toString().padStart(2,'0'); }

// ====== Simpan & muat pengaturan iqomah dari localStorage ======
function loadIqomahSettings() {
  for (const key in iqomahInput) {
    const saved = localStorage.getItem('iqomah_' + key);
    if (saved !== null) {
      document.getElementById(iqomahInput[key]).value = saved;
    }
  }
}
function saveIqomahSettings() {
  for (const key in iqomahInput) {
    localStorage.setItem('iqomah_' + key, document.getElementById(iqomahInput[key]).value);
  }
}
for (const key in iqomahInput) {
  document.getElementById(iqomahInput[key]).addEventListener('change', saveIqomahSettings);
}
loadIqomahSettings();

// ====== Simpan & muat pengaturan ON/OFF AC ======
function loadAcSettings() {
  document.querySelectorAll('.ac-input').forEach(input => {
    const key = `ac_${input.dataset.day}_${input.dataset.mode}`;
    const saved = localStorage.getItem(key);
    if (saved !== null) input.value = saved;
  });
}
function saveAcSetting(input) {
  const key = `ac_${input.dataset.day}_${input.dataset.mode}`;
  localStorage.setItem(key, input.value);
}
document.querySelectorAll('.ac-input').forEach(input => {
  input.addEventListener('change', () => saveAcSetting(input));
});
loadAcSettings();

// ====== Suara Beep ======
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq = 800, duration = 200, volume = 0.4) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.value = volume;
  osc.connect(gain);
  gain.connect(ctx.destination);
  const now = ctx.currentTime;
  osc.start(now);
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration / 1000);
  osc.stop(now + duration / 1000);
}
function beepAdzan() {
  beep(880, 200);
  setTimeout(() => beep(880, 200), 350);
  setTimeout(() => beep(880, 200), 700);
}
function beepPreIqomah() {
  beep(660, 200);
  setTimeout(() => beep(660, 200), 350);
}
function beepIqomah() {
  beep(440, 1500, 0.5);
}

document.getElementById('testBtn').addEventListener('click', () => {
  getAudioCtx();
  beepAdzan();
});
document.addEventListener('click', () => getAudioCtx(), { once: true });

// ====== Fetch Jadwal dari Aladhan API ======
async function fetchPrayerTimes() {
  const now = new Date();
  const dd = pad(now.getDate());
  const mm = pad(now.getMonth() + 1);
  const yyyy = now.getFullYear();
  const dateStr = `${dd}-${mm}-${yyyy}`;

  try {
    const url = `https://api.aladhan.com/v1/timingsByCity/${dateStr}?city=${encodeURIComponent(currentCity)}&country=${COUNTRY}&method=${METHOD}`;
    const res = await fetch(url);
    const data = await res.json();

    if (data.code === 200 && data.data && data.data.timings) {
      jadwal = data.data.timings;
      lastFetchDate = dateStr;
      triggeredAdzan = {};
      triggeredIqomahWarn = {};
      triggeredIqomahStart = {};
      document.getElementById('errorMsg').textContent = '';
      renderJadwal();
    } else {
      document.getElementById('errorMsg').textContent = `Kota "${currentCity}" tidak ditemukan.`;
    }
  } catch (e) {
    document.getElementById('errorMsg').textContent = 'Koneksi API gagal: ' + e.message;
  }
}

function renderJadwal() {
  document.querySelectorAll('.jadwal-table tbody td[data-key]').forEach(td => {
    const key = td.dataset.key;
    const val = jadwal[key];
    td.textContent = val ? val.slice(0, 5) : '-';
  });
}

// ====== Dapatkan waktu iqomah ======
function getIqomahTime(prayerKey) {
  const timeStr = jadwal[prayerKey];
  if (!timeStr) return null;
  const [h, m] = timeStr.slice(0, 5).split(':').map(Number);
  const menit = parseInt(document.getElementById(iqomahInput[prayerKey]).value) || 0;
  const iqomah = new Date();
  iqomah.setHours(h, m, 0, 0);
  iqomah.setMinutes(iqomah.getMinutes() + menit);
  return iqomah;
}

// ====== Cari event berikutnya ======
function getNextEvent(now) {
  let next = null;
  let minDiff = Infinity;

  for (const p of urutanSholat) {
    const adzanStr = jadwal[p];
    if (!adzanStr) continue;
    const [h, m] = adzanStr.slice(0, 5).split(':').map(Number);

    const adzanDate = new Date(now);
    adzanDate.setHours(h, m, 0, 0);

    const iqomahDate = getIqomahTime(p);
    if (!iqomahDate) continue;

    const diffAdzan = adzanDate - now;
    if (diffAdzan > 0 && diffAdzan < minDiff) {
      minDiff = diffAdzan;
      next = { type: 'adzan', key: p, date: adzanDate };
    }

    const diffIqomah = iqomahDate - now;
    if (diffIqomah > 0 && diffIqomah < minDiff) {
      minDiff = diffIqomah;
      next = { type: 'iqomah', key: p, date: iqomahDate };
    }
  }

  if (!next) {
    const besok = new Date(now);
    besok.setDate(besok.getDate() + 1);
    const adzanStr = jadwal.Fajr;
    if (adzanStr) {
      const [h, m] = adzanStr.slice(0, 5).split(':').map(Number);
      besok.setHours(h, m, 0, 0);
      next = { type: 'adzan', key: 'Fajr', date: besok };
    }
  }
  return next;
}

// ====== Trigger Beep & Blackout ======
function checkTriggers(now) {
  const todayKey = `${pad(now.getDate())}-${pad(now.getMonth()+1)}-${now.getFullYear()}`;

  for (const p of urutanSholat) {
    const adzanStr = jadwal[p];
    if (!adzanStr) continue;
    const [h, m] = adzanStr.slice(0, 5).split(':').map(Number);

    // Adzan
    const adzanTime = new Date(now);
    adzanTime.setHours(h, m, 0, 0);
    const diffAdzan = now - adzanTime;
    const keyAdzan = `adzan_${p}_${todayKey}`;
    if (diffAdzan >= 0 && diffAdzan < 60000 && !triggeredAdzan[keyAdzan]) {
      triggeredAdzan[keyAdzan] = true;
      beepAdzan();
    }

    // 1 menit sebelum iqomah
    const iqomahDate = getIqomahTime(p);
    if (!iqomahDate) continue;
    const warnTime = new Date(iqomahDate.getTime() - 60000);
    const diffWarn = now - warnTime;
    const keyWarn = `warn_${p}_${todayKey}`;
    if (diffWarn >= 0 && diffWarn < 60000 && !triggeredIqomahWarn[keyWarn]) {
      triggeredIqomahWarn[keyWarn] = true;
      beepPreIqomah();
    }

    // Iqomah
    const diffIqomah = now - iqomahDate;
    const keyIqomah = `iqomah_${p}_${todayKey}`;
    if (diffIqomah >= 0 && diffIqomah < 60000 && !triggeredIqomahStart[keyIqomah]) {
      triggeredIqomahStart[keyIqomah] = true;
      beepIqomah();
      startBlackout();
    }

    // ===== Trigger ON/OFF AC =====
    const hariIni = now.getDay(); // 0=Ahad, 1=Senin, ... 6=Sabtu
    ['on', 'off'].forEach(mode => {
      const input = document.querySelector(`.ac-input[data-day="${hariIni}"][data-mode="${mode}"]`);
      if (!input) return;
      const offsetMenit = parseInt(input.value) || 0;
      const targetTime = new Date(adzanTime.getTime() + offsetMenit * 60000);
      const diff = now - targetTime;
      const key = `ac_${mode}_${p}_${todayKey}`;
      if (!window['triggeredAC']) window['triggeredAC'] = {};
      if (diff >= 0 && diff < 60000 && !window.triggeredAC[key]) {
        window.triggeredAC[key] = true;
        console.log(`[AC] ${mode.toUpperCase()} — ${namaIndo[p]} (${offsetMenit} menit dari adzan) — hari ${namaHari[hariIni]}`);
        // Di sini nanti bisa ditambahkan panggilan fetch ke backend Tuya
        // Contoh:
        // fetch(`${PROXY_URL}?action=ac_${mode}`);
      }
    });
  }
}

// ====== Layar hitam 5 menit ======
function startBlackout() {
  document.body.classList.add('blackout');
  if (blackoutTimer) clearTimeout(blackoutTimer);
  blackoutTimer = setTimeout(() => {
    document.body.classList.remove('blackout');
  }, 5 * 60 * 1000);
}

// ====== Update Tampilan ======
function updateClock() {
  const now = new Date();

  document.getElementById('clock').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

  document.getElementById('date').textContent =
    `${namaHari[now.getDay()]}, ${now.getDate()} ${namaBulan[now.getMonth()]} ${now.getFullYear()}`;

  const todayStr = `${pad(now.getDate())}-${pad(now.getMonth() + 1)}-${now.getFullYear()}`;
  if (todayStr !== lastFetchDate && !document.hidden) {
    fetchPrayerTimes();
  }

  if (jadwal.Fajr) {
    checkTriggers(now);

    const next = getNextEvent(now);
    const nextBox = document.getElementById('nextBox');
    const nextLabel = document.getElementById('nextLabel');
    const nextName = document.getElementById('nextName');
    const countdown = document.getElementById('countdown');

    if (next) {
      const totalSec = Math.max(0, Math.floor((next.date - now) / 1000));
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const d = totalSec % 60;
      countdown.textContent = `- ${pad(h)}:${pad(m)}:${pad(d)}`;

      if (next.type === 'adzan') {
        nextBox.classList.remove('qobla');
        nextLabel.textContent = 'Menuju Waktu Sholat';
        nextName.textContent = namaIndo[next.key];
      } else {
        nextBox.classList.remove('qobla');
        nextLabel.textContent = 'Menuju Iqomah';
        nextName.textContent = namaIndo[next.key];
        if (totalSec <= 60) {
          nextBox.classList.add('qobla');
          nextLabel.textContent = 'Menuju Iqomah';
          nextName.textContent = `STOP SHOLAT SUNAT QOBLA ${namaIndo[next.key].toUpperCase()}`;
        }
      }

      document.querySelectorAll('.jadwal-table [data-key]').forEach(el => {
        el.classList.toggle('active', el.dataset.key === next.key);
      });
    }
  }
}

// ====== Ganti kota ======
document.getElementById('citySelect').addEventListener('change', function() {
  currentCity = this.value;
  lastFetchDate = '';
  jadwal = {};
  triggeredAdzan = {};
  triggeredIqomahWarn = {};
  triggeredIqomahStart = {};
  window.triggeredAC = {};
  document.getElementById('nextName').textContent = 'Memuat...';
  document.querySelectorAll('.jadwal-table [data-key]').forEach(el => {
    el.classList.remove('active');
  });
  fetchPrayerTimes();
});

// ====== Inisialisasi ======
fetchPrayerTimes();
setInterval(updateClock, 1000);
updateClock();
</script>
