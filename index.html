<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jam Adzan - Klaten</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕌</text></svg>">
 
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
  }
  .container { padding: 20px; width: 100%; max-width: 720px; }

  h1 {
    font-size: 1.3rem;
    opacity: 0.8;
    letter-spacing: 2px;
    margin: 0 0 10px;
  }
  .location {
    font-size: 0.9rem;
    color: #00ffcc;
    opacity: 0.9;
    margin-bottom: 5px;
  }

  .clock {
    font-size: 3.5rem;
    font-weight: bold;
    margin: 10px 0;
    text-shadow: 0 0 20px #00ffcc;
    font-variant-numeric: tabular-nums;
  }

  .date {
    font-size: 0.95rem;
    opacity: 0.7;
    margin-bottom: 20px;
  }

  .next {
    background: rgba(255,255,255,0.1);
    padding: 15px 25px;
    border-radius: 15px;
    display: inline-block;
    backdrop-filter: blur(10px);
    margin-bottom: 25px;
  }
  .next-label { font-size: 0.85rem; opacity: 0.7; }
  .next-name {
    font-size: 1.6rem;
    color: #00ffcc;
    font-weight: bold;
    margin: 4px 0;
  }
  .countdown {
    font-size: 1.1rem;
    font-variant-numeric: tabular-nums;
  }

  /* ===== Tabel Jadwal Sholat Horizontal ===== */
  .jadwal-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: rgba(255,255,255,0.06);
    border-radius: 15px;
    overflow: hidden;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    table-layout: fixed;
  }

  .jadwal-table th,
  .jadwal-table td {
    padding: 14px 4px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    border-left: 1px solid rgba(255,255,255,0.08);
  }
  .jadwal-table th:first-child,
  .jadwal-table td:first-child { border-left: none; }

  .jadwal-table thead th {
    background: rgba(0, 255, 204, 0.15);
    color: #00ffcc;
    font-size: 0.72rem;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    font-weight: 600;
    padding: 12px 2px;
  }

  .jadwal-table tbody td {
    font-size: 1rem;
    font-weight: 600;
    border-top: 1px solid rgba(255,255,255,0.08);
    transition: background 0.3s;
  }

  .jadwal-table .active {
    background: linear-gradient(180deg, rgba(0,255,204,0.25), rgba(0,255,204,0.05));
    color: #00ffcc;
    text-shadow: 0 0 12px rgba(0,255,204,0.6);
  }
  .jadwal-table thead th.active {
    background: rgba(0, 255, 204, 0.35);
  }

  /* Kolom Syuruq (Terbit) warna berbeda agar beda dari waktu sholat */
  .jadwal-table .syuruq {
    color: #ffd54f;
  }
  .jadwal-table thead th[data-key="Sunrise"] {
    background: rgba(255, 213, 79, 0.15);
    color: #ffd54f;
  }

  .error-msg {
    font-size: 0.8rem;
    color: #ff8a80;
    margin-top: 15px;
  }

  @media (max-width: 560px) {
    .clock { font-size: 2.3rem; }
    .next-name { font-size: 1.3rem; }
    .jadwal-table thead th { font-size: 0.58rem; padding: 10px 1px; letter-spacing: 0; }
    .jadwal-table tbody td { font-size: 0.82rem; padding: 12px 1px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>WAKTU SEKARANG</h1>
  <div class="location" id="location">📍 Klaten, Indonesia</div>
  <div class="clock" id="clock">--:--:--</div>
  <div class="date" id="date">-</div>

  <div class="next">
    <div class="next-label">Menuju Waktu Sholat</div>
    <div class="next-name" id="nextName">Memuat...</div>
    <div class="countdown" id="countdown">-</div>
  </div>

  <!-- ===== Tabel Jadwal Sholat Horizontal (6 kolom) ===== -->
  <table class="jadwal-table">
    <thead>
      <tr>
        <th data-key="Fajr">Subuh</th>
        <th data-key="Sunrise">Terbit</th>
        <th data-key="Dhuhr">Dzuhur</th>
        <th data-key="Asr">Ashar</th>
        <th data-key="Maghrib">Maghrib</th>
        <th data-key="Isha">Isya</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td data-key="Fajr">-</td>
        <td data-key="Sunrise" class="syuruq">-</td>
        <td data-key="Dhuhr">-</td>
        <td data-key="Asr">-</td>
        <td data-key="Maghrib">-</td>
        <td data-key="Isha">-</td>
      </tr>
    </tbody>
  </table>
  <div class="error-msg" id="errorMsg"></div>
</div>

<script>
// ====== Konfigurasi Aladhan API ======
// Klaten, Jawa Tengah, Indonesia
// Method 20 = Kementerian Agama Republik Indonesia (Kemenag)
const API_CONFIG = {
  city: 'Klaten',
  country: 'Indonesia',
  method: 20
};

// ====== State ======
let jadwal = {};
let lastFetchDate = '';

const namaHari  = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const namaBulan = ["Januari","Februari","Maret","April","Mei","Juni",
                   "Juli","Agustus","September","Oktober","November","Desember"];
const namaIndo = {
  Fajr: 'Subuh',
  Sunrise: 'Terbit',
  Dhuhr: 'Dzuhur',
  Asr: 'Ashar',
  Maghrib: 'Maghrib',
  Isha: 'Isya'
};

function pad(n){ return n.toString().padStart(2,'0'); }

// ====== Fetch Jadwal dari Aladhan API ======
async function fetchPrayerTimes() {
  const now = new Date();
  const dd = pad(now.getDate());
  const mm = pad(now.getMonth() + 1);
  const yyyy = now.getFullYear();
  const dateStr = `${dd}-${mm}-${yyyy}`;

  if (lastFetchDate === dateStr && jadwal.Fajr) return;

  try {
    const url = `https://api.aladhan.com/v1/timingsByCity/${dateStr}?city=${API_CONFIG.city}&country=${API_CONFIG.country}&method=${API_CONFIG.method}`;
    const res = await fetch(url);
    const data = await res.json();

    if (data.code === 200 && data.data && data.data.timings) {
      jadwal = data.data.timings;
      lastFetchDate = dateStr;
      document.getElementById('errorMsg').textContent = '';
      renderJadwal();
    } else {
      document.getElementById('errorMsg').textContent = 'Gagal memuat jadwal sholat.';
    }
  } catch (e) {
    document.getElementById('errorMsg').textContent = 'Koneksi API gagal: ' + e.message;
  }
}

// ====== Isi Tabel ======
function renderJadwal() {
  document.querySelectorAll('.jadwal-table tbody td').forEach(td => {
    const key = td.dataset.key;
    const val = jadwal[key];
    td.textContent = val ? val.slice(0, 5) : '-';
  });
}

// ====== Cari Waktu Berikutnya (termasuk Terbit) ======
// Terbit ikut dihitung sebagai "waktu berikutnya" agar countdown juga
// menunjuk ke matahari terbit saat sudah lewat Subuh.
function getNextEvent(now) {
  const events = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
  const nowMin = now.getHours() * 60 + now.getMinutes();
  let next = null;
  let minDiff = Infinity;

  for (const p of events) {
    const timeStr = jadwal[p];
    if (!timeStr) continue;
    const [h, m] = timeStr.slice(0, 5).split(':').map(Number);
    let diff = (h * 60 + m) - nowMin;
    if (diff <= 0) diff += 24 * 60;
    if (diff < minDiff) {
      minDiff = diff;
      next = { key: p, name: namaIndo[p], diff: diff };
    }
  }
  return next;
}

// ====== Update Tampilan ======
function updateClock() {
  const now = new Date();

  document.getElementById('clock').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

  document.getElementById('date').textContent =
    `${namaHari[now.getDay()]}, ${now.getDate()} ${namaBulan[now.getMonth()]} ${now.getFullYear()}`;

  // Cek pergantian hari → fetch ulang
  const todayStr = `${pad(now.getDate())}-${pad(now.getMonth() + 1)}-${now.getFullYear()}`;
  if (todayStr !== lastFetchDate) {
    fetchPrayerTimes();
  }

  if (jadwal.Fajr) {
    const next = getNextEvent(now);
    if (next) {
      document.getElementById('nextName').textContent = next.name;
      const totalSec = next.diff * 60 - now.getSeconds();
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const d = totalSec % 60;
      document.getElementById('countdown').textContent = `- ${pad(h)}:${pad(m)}:${pad(d)}`;

      document.querySelectorAll('.jadwal-table [data-key]').forEach(el => {
        el.classList.toggle('active', el.dataset.key === next.key);
      });
    }
  }
}

// ====== Inisialisasi ======
fetchPrayerTimes();
setInterval(updateClock, 1000);
updateClock();
</script>
</body>
</html>
