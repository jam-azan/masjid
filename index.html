<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jam Adzan - Indonesia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕌</text></svg>">

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
    transition: background 0.5s;
  }

  /* Layar hitam saat iqomah */
  body.blackout {
    background: #000;
  }
  body.blackout .container {
    visibility: hidden;
  }
  body.blackout::after {
    content: '';
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
  }

  .container { padding: 20px; width: 100%; max-width: 720px; }

  h1 {
    font-size: 1.3rem;
    opacity: 0.8;
    letter-spacing: 2px;
    margin: 0 0 10px;
  }

  .location {
    font-size: 0.9rem;
    color: #00ffcc;
    opacity: 0.9;
    margin-bottom: 5px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }

  #citySelect {
    background: rgba(0, 255, 204, 0.15);
    color: #00ffcc;
    border: 1px solid rgba(0, 255, 204, 0.4);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.95rem;
    font-family: 'Segoe UI', sans-serif;
    cursor: pointer;
    outline: none;
  }
  #citySelect option {
    background: #203a43;
    color: #fff;
  }

  .clock {
    font-size: 3.5rem;
    font-weight: bold;
    margin: 10px 0;
    text-shadow: 0 0 20px #00ffcc;
    font-variant-numeric: tabular-nums;
  }

  .date {
    font-size: 0.95rem;
    opacity: 0.7;
    margin-bottom: 20px;
  }

  .next {
    background: rgba(255,255,255,0.1);
    padding: 15px 25px;
    border-radius: 15px;
    display: inline-block;
    backdrop-filter: blur(10px);
    margin-bottom: 25px;
    min-width: 280px;
  }
  .next-label { font-size: 0.85rem; opacity: 0.7; }
  .next-name {
    font-size: 1.6rem;
    color: #00ffcc;
    font-weight: bold;
    margin: 4px 0;
    min-height: 1.6rem;
  }
  .countdown {
    font-size: 1.1rem;
    font-variant-numeric: tabular-nums;
  }

  /* Warna khusus saat masuk mode qobla (menjelang iqomah) */
  .next.qobla .next-label { color: #ffd54f; }
  .next.qobla .next-name { color: #ffd54f; font-size: 1.3rem; }
  .next.qobla .countdown { color: #ffd54f; }

  /* Tabel */
  .jadwal-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: rgba(255,255,255,0.06);
    border-radius: 15px;
    overflow: hidden;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    table-layout: fixed;
  }

  .jadwal-table th,
  .jadwal-table td {
    padding: 12px 3px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    border-left: 1px solid rgba(255,255,255,0.08);
  }
  .jadwal-table th:first-child,
  .jadwal-table td:first-child { border-left: none; }

  .jadwal-table thead th {
    background: rgba(0, 255, 204, 0.15);
    color: #00ffcc;
    font-size: 0.7rem;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    font-weight: 600;
    padding: 10px 2px;
  }

  .jadwal-table tbody td {
    font-size: 1rem;
    font-weight: 600;
    border-top: 1px solid rgba(255,255,255,0.08);
    transition: background 0.3s;
  }

  /* Baris kedua: isian menit iqomah */
  .jadwal-table tbody tr.iqomah-row td {
    font-size: 0.75rem;
    font-weight: normal;
    color: #ffd54f;
    padding: 6px 2px;
    background: rgba(255, 213, 79, 0.06);
  }
  .jadwal-table tbody tr.iqomah-row input {
    width: 42px;
    background: rgba(255,255,255,0.1);
    color: #ffd54f;
    border: 1px solid rgba(255, 213, 79, 0.4);
    border-radius: 5px;
    padding: 3px;
    text-align: center;
    font-size: 0.75rem;
    font-family: inherit;
    outline: none;
  }
  .jadwal-table tbody tr.iqomah-row input:focus {
    border-color: #ffd54f;
    background: rgba(255, 213, 79, 0.15);
  }

  .jadwal-table .active {
    background: linear-gradient(180deg, rgba(0,255,204,0.25), rgba(0,255,204,0.05));
    color: #00ffcc;
    text-shadow: 0 0 12px rgba(0,255,204,0.6);
  }
  .jadwal-table thead th.active {
    background: rgba(0, 255, 204, 0.35);
  }

  .jadwal-table .syuruq {
    color: #ffd54f;
  }
  .jadwal-table thead th[data-key="Sunrise"] {
    background: rgba(255, 213, 79, 0.15);
    color: #ffd54f;
  }

  .error-msg {
    font-size: 0.8rem;
    color: #ff8a80;
    margin-top: 15px;
    min-height: 18px;
  }

  /* Tombol test beep */
  .test-btn {
    margin-top: 15px;
    background: rgba(0, 255, 204, 0.15);
    color: #00ffcc;
    border: 1px solid rgba(0, 255, 204, 0.4);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: inherit;
  }
  .test-btn:hover { background: rgba(0, 255, 204, 0.25); }

  @media (max-width: 560px) {
    .clock { font-size: 2.3rem; }
    .next-name { font-size: 1.3rem; }
    .jadwal-table thead th { font-size: 0.55rem; padding: 8px 1px; letter-spacing: 0; }
    .jadwal-table tbody td { font-size: 0.82rem; padding: 10px 1px; }
    .jadwal-table tbody tr.iqomah-row td { font-size: 0.65rem; padding: 5px 1px; }
    .jadwal-table tbody tr.iqomah-row input { width: 34px; font-size: 0.65rem; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>WAKTU SEKARANG</h1>

  <div class="location">
    📍 <select id="citySelect">
      <option value="Klaten">Klaten</option>
      <option value="Jakarta">Jakarta</option>
      <option value="Surabaya">Surabaya</option>
      <option value="Medan">Medan</option>
      <option value="Bandung">Bandung</option>
      <option value="Semarang">Semarang</option>
      <option value="Yogyakarta">Yogyakarta</option>
      <option value="Makassar">Makassar</option>
      <option value="Palembang">Palembang</option>
      <option value="Denpasar">Denpasar</option>
      <option value="Malang">Malang</option>
      <option value="Padang">Padang</option>
      <option value="Pekanbaru">Pekanbaru</option>
      <option value="Banjarmasin">Banjarmasin</option>
      <option value="Pontianak">Pontianak</option>
      <option value="Manado">Manado</option>
      <option value="Jayapura">Jayapura</option>
      <option value="Ambon">Ambon</option>
      <option value="Mataram">Mataram</option>
      <option value="Kupang">Kupang</option>
    </select>
  </div>

  <div class="clock" id="clock">--:--:--</div>
  <div class="date" id="date">-</div>

  <div class="next" id="nextBox">
    <div class="next-label" id="nextLabel">Menuju Iqomah</div>
    <div class="next-name" id="nextName">Memuat...</div>
    <div class="countdown" id="countdown">-</div>
  </div>

  <table class="jadwal-table">
    <thead>
      <tr>
        <th data-key="Fajr">Subuh</th>
        <th data-key="Sunrise">Terbit</th>
        <th data-key="Dhuhr">Dzuhur</th>
        <th data-key="Asr">Ashar</th>
        <th data-key="Maghrib">Maghrib</th>
        <th data-key="Isha">Isya</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td data-key="Fajr">-</td>
        <td data-key="Sunrise" class="syuruq">-</td>
        <td data-key="Dhuhr">-</td>
        <td data-key="Asr">-</td>
        <td data-key="Maghrib">-</td>
        <td data-key="Isha">-</td>
      </tr>
      <tr class="iqomah-row">
        <td><input type="number" id="iqomahFajr" value="10" min="0" max="60" title="Menit iqomah Subuh"></td>
        <td>—</td>
        <td><input type="number" id="iqomahDhuhr" value="10" min="0" max="60" title="Menit iqomah Dzuhur"></td>
        <td><input type="number" id="iqomahAsr" value="10" min="0" max="60" title="Menit iqomah Ashar"></td>
        <td><input type="number" id="iqomahMaghrib" value="7" min="0" max="60" title="Menit iqomah Maghrib"></td>
        <td><input type="number" id="iqomahIsha" value="10" min="0" max="60" title="Menit iqomah Isya"></td>
      </tr>
    </tbody>
  </table>
  <div class="error-msg" id="errorMsg"></div>

  <button class="test-btn" id="testBtn">🔊 Test Suara Beep</button>
</div>

<script>
// ====== Konfigurasi ======
const COUNTRY = 'Indonesia';
const METHOD = 20;
let currentCity = 'Klaten';

// ====== State ======
let jadwal = {};
let lastFetchDate = '';
let triggeredAdzan = {};    // {key_date: true} — sudah beep adzan
let triggeredIqomahWarn = {}; // sudah beep 1 menit sebelum iqomah
let triggeredIqomahStart = {}; // sudah beep iqomah
let blackoutTimer = null;

const namaHari  = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const namaBulan = ["Januari","Februari","Maret","April","Mei","Juni",
                   "Juli","Agustus","September","Oktober","November","Desember"];
const namaIndo = {
  Fajr: 'Subuh',
  Sunrise: 'Terbit',
  Dhuhr: 'Dzuhur',
  Asr: 'Ashar',
  Maghrib: 'Maghrib',
  Isha: 'Isya'
};
const urutanSholat = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];

// Pemetaan input iqomah
const iqomahInput = {
  Fajr: 'iqomahFajr',
  Dhuhr: 'iqomahDhuhr',
  Asr: 'iqomahAsr',
  Maghrib: 'iqomahMaghrib',
  Isha: 'iqomahIsha'
};

function pad(n){ return n.toString().padStart(2,'0'); }

// ====== Simpan & muat pengaturan iqomah dari localStorage ======
function loadIqomahSettings() {
  for (const key in iqomahInput) {
    const saved = localStorage.getItem('iqomah_' + key);
    if (saved !== null) {
      document.getElementById(iqomahInput[key]).value = saved;
    }
  }
}
function saveIqomahSettings() {
  for (const key in iqomahInput) {
    localStorage.setItem('iqomah_' + key, document.getElementById(iqomahInput[key]).value);
  }
}
// Simpan saat ada perubahan
for (const key in iqomahInput) {
  document.getElementById(iqomahInput[key]).addEventListener('change', saveIqomahSettings);
}
loadIqomahSettings();

// ====== Fungsi Suara Beep (Web Audio API) ======
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function beep(freq = 800, duration = 200, volume = 0.4) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.value = volume;
  osc.connect(gain);
  gain.connect(ctx.destination);
  const now = ctx.currentTime;
  osc.start(now);
  // Fade out halus supaya tidak "klik"
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration / 1000);
  osc.stop(now + duration / 1000);
}

// 3 kali beep untuk adzan
function beepAdzan() {
  beep(880, 200);
  setTimeout(() => beep(880, 200), 350);
  setTimeout(() => beep(880, 200), 700);
}

// 2 kali beep untuk 1 menit sebelum iqomah
function beepPreIqomah() {
  beep(660, 200);
  setTimeout(() => beep(660, 200), 350);
}

// 1 beep panjang untuk iqomah
function beepIqomah() {
  beep(440, 1500, 0.5);
}

// ====== Test button ======
document.getElementById('testBtn').addEventListener('click', () => {
  getAudioCtx(); // aktifkan audio context dari interaksi user
  beepAdzan();
});

// Aktifkan audio context saat interaksi pertama
document.addEventListener('click', () => getAudioCtx(), { once: true });

// ====== Fetch Jadwal dari Aladhan API ======
async function fetchPrayerTimes() {
  const now = new Date();
  const dd = pad(now.getDate());
  const mm = pad(now.getMonth() + 1);
  const yyyy = now.getFullYear();
  const dateStr = `${dd}-${mm}-${yyyy}`;

  try {
    const url = `https://api.aladhan.com/v1/timingsByCity/${dateStr}?city=${encodeURIComponent(currentCity)}&country=${COUNTRY}&method=${METHOD}`;
    const res = await fetch(url);
    const data = await res.json();

    if (data.code === 200 && data.data && data.data.timings) {
      jadwal = data.data.timings;
      lastFetchDate = dateStr;
      triggeredAdzan = {};
      triggeredIqomahWarn = {};
      triggeredIqomahStart = {};
      document.getElementById('errorMsg').textContent = '';
      renderJadwal();
    } else {
      document.getElementById('errorMsg').textContent = `Kota "${currentCity}" tidak ditemukan.`;
    }
  } catch (e) {
    document.getElementById('errorMsg').textContent = 'Koneksi API gagal: ' + e.message;
  }
}

// ====== Isi Tabel ======
function renderJadwal() {
  document.querySelectorAll('.jadwal-table tbody td[data-key]').forEach(td => {
    const key = td.dataset.key;
    const val = jadwal[key];
    td.textContent = val ? val.slice(0, 5) : '-';
  });
}

// ====== Dapatkan waktu iqomah untuk suatu sholat ======
function getIqomahTime(prayerKey) {
  const timeStr = jadwal[prayerKey];
  if (!timeStr) return null;
  const [h, m] = timeStr.slice(0, 5).split(':').map(Number);
  const menit = parseInt(document.getElementById(iqomahInput[prayerKey]).value) || 0;

  const iqomah = new Date();
  iqomah.setHours(h, m, 0, 0);
  iqomah.setMinutes(iqomah.getMinutes() + menit);
  return iqomah;
}

// ====== Cari event berikutnya (adzan atau iqomah) ======
function getNextEvent(now) {
  let next = null;
  let minDiff = Infinity;

  for (const p of urutanSholat) {
    const adzanStr = jadwal[p];
    if (!adzanStr) continue;
    const [h, m] = adzanStr.slice(0, 5).split(':').map(Number);

    // Adzan hari ini
    const adzanDate = new Date(now);
    adzanDate.setHours(h, m, 0, 0);

    // Iqomah hari ini
    const iqomahDate = getIqomahTime(p);
    if (!iqomahDate) continue;

    // Hitung selisih adzan (jika belum lewat)
    const diffAdzan = adzanDate - now;
    if (diffAdzan > 0 && diffAdzan < minDiff) {
      minDiff = diffAdzan;
      next = { type: 'adzan', key: p, date: adzanDate };
    }

    // Hitung selisih iqomah (jika sudah adzan tapi belum iqomah)
    const diffIqomah = iqomahDate - now;
    if (diffIqomah > 0 && diffIqomah < minDiff) {
      minDiff = diffIqomah;
      next = { type: 'iqomah', key: p, date: iqomahDate };
    }
  }

  // Kalau semua sudah lewat hari ini, ambil adzan Subuh besok
  if (!next) {
    const besok = new Date(now);
    besok.setDate(besok.getDate() + 1);
    const adzanStr = jadwal.Fajr;
    if (adzanStr) {
      const [h, m] = adzanStr.slice(0, 5).split(':').map(Number);
      besok.setHours(h, m, 0, 0);
      next = { type: 'adzan', key: 'Fajr', date: besok };
    }
  }
  return next;
}

// ====== Cek trigger (adzan, pre-iqomah, iqomah) ======
function checkTriggers(now) {
  const todayKey = `${pad(now.getDate())}-${pad(now.getMonth()+1)}-${now.getFullYear()}`;

  for (const p of urutanSholat) {
    const adzanStr = jadwal[p];
    if (!adzanStr) continue;
    const [h, m] = adzanStr.slice(0, 5).split(':').map(Number);

    // ===== Trigger Adzan: tepat di menit adzan (dalam 1 menit pertama) =====
    const adzanTime = new Date(now);
    adzanTime.setHours(h, m, 0, 0);
    const diffAdzan = now - adzanTime;
    const keyAdzan = `adzan_${p}_${todayKey}`;
    if (diffAdzan >= 0 && diffAdzan < 60000 && !triggeredAdzan[keyAdzan]) {
      triggeredAdzan[keyAdzan] = true;
      beepAdzan();
      console.log(`[BEep] Adzan ${namaIndo[p]}`);
    }

    // ===== Trigger 1 menit sebelum iqomah (beep 2x) =====
    const iqomahDate = getIqomahTime(p);
    if (!iqomahDate) continue;
    const warnTime = new Date(iqomahDate.getTime() - 60000); // 1 menit sebelum
    const diffWarn = now - warnTime;
    const keyWarn = `warn_${p}_${todayKey}`;
    if (diffWarn >= 0 && diffWarn < 60000 && !triggeredIqomahWarn[keyWarn]) {
      triggeredIqomahWarn[keyWarn] = true;
      beepPreIqomah();
      console.log(`[Beep] 1 menit menuju iqomah ${namaIndo[p]}`);
    }

    // ===== Trigger Iqomah: beep panjang + layar hitam =====
    const diffIqomah = now - iqomahDate;
    const keyIqomah = `iqomah_${p}_${todayKey}`;
    if (diffIqomah >= 0 && diffIqomah < 60000 && !triggeredIqomahStart[keyIqomah]) {
      triggeredIqomahStart[keyIqomah] = true;
      beepIqomah();
      console.log(`[Beep] Iqomah ${namaIndo[p]}`);
      startBlackout();
    }
  }
}

// ====== Layar hitam selama 5 menit ======
function startBlackout() {
  document.body.classList.add('blackout');
  if (blackoutTimer) clearTimeout(blackoutTimer);
  blackoutTimer = setTimeout(() => {
    document.body.classList.remove('blackout');
  }, 5 * 60 * 1000); // 5 menit
}

// ====== Update Tampilan ======
function updateClock() {
  const now = new Date();

  document.getElementById('clock').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

  document.getElementById('date').textContent =
    `${namaHari[now.getDay()]}, ${now.getDate()} ${namaBulan[now.getMonth()]} ${now.getFullYear()}`;

  // Cek pergantian hari
  const todayStr = `${pad(now.getDate())}-${pad(now.getMonth() + 1)}-${now.getFullYear()}`;
  if (todayStr !== lastFetchDate && !document.hidden) {
    fetchPrayerTimes();
  }

  if (jadwal.Fajr) {
    checkTriggers(now);

    const next = getNextEvent(now);
    const nextBox = document.getElementById('nextBox');
    const nextLabel = document.getElementById('nextLabel');
    const nextName = document.getElementById('nextName');
    const countdown = document.getElementById('countdown');

    if (next) {
      // Hitung countdown
      const totalSec = Math.max(0, Math.floor((next.date - now) / 1000));
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const d = totalSec % 60;
      countdown.textContent = `- ${pad(h)}:${pad(m)}:${pad(d)}`;

      if (next.type === 'adzan') {
        // Menuju adzan — mode normal
        nextBox.classList.remove('qobla');
        nextLabel.textContent = 'Menuju Waktu Sholat';
        nextName.textContent = namaIndo[next.key];
        // Highlight kolom
        document.querySelectorAll('.jadwal-table [data-key]').forEach(el => {
          el.classList.toggle('active', el.dataset.key === next.key);
        });
      } else {
        // Menuju iqomah — kalau sudah <= 1 menit, tampilkan mode qobla
        nextBox.classList.remove('qobla');
        nextLabel.textContent = 'Menuju Iqomah';
        nextName.textContent = namaIndo[next.key];

        // Kalau sisa waktu <= 60 detik, ganti label ke mode qobla
        if (totalSec <= 60) {
          nextBox.classList.add('qobla');
          nextLabel.textContent = 'Menuju Iqomah';
          nextName.textContent = `STOP SHOLAT SUNAT QOBLA ${namaIndo[next.key].toUpperCase()}`;
        }

        document.querySelectorAll('.jadwal-table [data-key]').forEach(el => {
          el.classList.toggle('active', el.dataset.key === next.key);
        });
      }
    }
  }
}

// ====== Event saat kota diganti ======
document.getElementById('citySelect').addEventListener('change', function() {
  currentCity = this.value;
  lastFetchDate = '';
  jadwal = {};
  triggeredAdzan = {};
  triggeredIqomahWarn = {};
  triggeredIqomahStart = {};
  document.getElementById('nextName').textContent = 'Memuat...';
  document.querySelectorAll('.jadwal-table [data-key]').forEach(el => {
    el.classList.remove('active');
  });
  fetchPrayerTimes();
});

// ====== Inisialisasi ======
fetchPrayerTimes();
setInterval(updateClock, 1000);
updateClock();
</script>
</body>
</html>
